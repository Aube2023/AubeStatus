<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Statut en temps reel des services L'Aube Etoilee">
<title>{% block title %}AubeStatus - Statut des services{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/logo.svg') }}">
</head>
<body>
<header class="site-header">
  <div class="container">
    <a class="brand" href="/">
      <img class="brand-logo" src="{{ url_for('static', filename='img/logo.svg') }}" alt="AubeStatus">
    </a>
    <nav class="site-nav">
      <a href="/">Accueil</a>
      <a href="/api">API</a>
      <a href="https://aubeetoilee.com" target="_blank" rel="noopener">L'Aube Etoilee</a>
    </nav>
  </div>
</header>

<main class="container">
  {% block content %}{% endblock %}
</main>

<footer class="site-footer">
  <div class="container">
    <p>AubeStatus — Mise a jour {{ now }} · Historique {{ retention_days|default(90) }} jours</p>
    <p>Partie de la suite <a href="https://aubeetoilee.com">L'Aube Etoilee</a></p>
  </div>
</footer>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
